# SPA fallback: le rotte client-side (React Router) devono rispondere con index.html
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Asset con hash nel nome: cache lunga
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service worker e manifest PWA: mai in cache
    location ~* /(sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
